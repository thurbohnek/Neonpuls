  [[1,1,0.45],[4,0.35,0.08],[10,0.1,0.03]].forEach(([r,a,d])=>{const o=AC.createOscillator(),gg=AC.createGain(); o.type='sine'; o.frequency.value=mtof(m)*r; env(gg,t,0.001,vol*1.6*a,d); o.connect(gg); gg.connect(g); o.start(t); o.stop(t+d+0.05);});
  outChain(g,pv);
}
function leadOrgan(m,t,vol,pv){
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol*1.1,t+0.01); g.gain.setValueAtTime(vol*1.1,t+0.22); g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
  [[1,1],[2,0.6],[3,0.4],[4,0.25]].forEach(([r,a])=>{const o=AC.createOscillator(),gg=AC.createGain(); o.type='sine'; o.frequency.value=mtof(m)*r; gg.gain.value=a*0.5; o.connect(gg); gg.connect(g); o.start(t); o.stop(t+0.42);});
  outChain(g,pv);
}
function leadSuper(m,t,vol,pv){
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.Q.value=2; f.frequency.setValueAtTime(9000,t); f.frequency.exponentialRampToValueAtTime(1800,t+0.45);
  const g=AC.createGain(); env(g,t,0.004,vol*0.85,0.5);
  [-28,-14,0,14,28].forEach(d=>{const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m); o.detune.value=d; o.connect(f); o.start(t); o.stop(t+0.6);});
  const o2=AC.createOscillator(); o2.type='sawtooth'; o2.frequency.value=mtof(m-12); o2.connect(f); o2.start(t); o2.stop(t+0.6);
  f.connect(g); outChain(g,pv);
}
function leadCowbell(m,t,vol,pv){
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=Math.min(9000,mtof(m)*2); f.Q.value=1.4;
  const g=AC.createGain(); env(g,t,0.001,vol*2.4,0.22);
  [1,1.48].forEach(r=>{const o=AC.createOscillator(); o.type='square'; o.frequency.value=mtof(m)*r; o.connect(f); o.start(t); o.stop(t+0.3);});
  f.connect(g); outChain(g,pv);
}
function cowArp(m,t){ const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=Math.min(9000,mtof(m)*2); f.Q.value=1.4; const g=AC.createGain(); env(g,t,0.001,0.16,0.16);
  [1,1.48].forEach(r=>{const o=AC.createOscillator(); o.type='square'; o.frequency.value=mtof(m)*r; o.connect(f); o.start(t); o.stop(t+0.2);}); f.connect(g); const p=panned(g,(Math.random()-.5)*0.6); p.connect(musicBus); p.connect(delaySend); }
function bigStab(ms,t){
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.Q.value=3; f.frequency.setValueAtTime(8000,t); f.frequency.exponentialRampToValueAtTime(900,t+0.2);
  const g=AC.createGain(); env(g,t,0.003,0.1,0.22); f.connect(g); g.connect(musicBus); g.connect(revSend);
  ms.forEach(m=>[-20,0,20].forEach(d=>{const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m+12); o.detune.value=d; o.connect(f); o.start(t); o.stop(t+0.28);}));

function lead(m,t,vol,pv){
  t=t||AC.currentTime; vol=vol||0.13;
  const L=SONG.lead;
  if(L==='bell') return leadBell(m,t,vol,pv);
  if(L==='square') return leadSquare(m,t,vol,pv);
  if(L==='pluck') return leadPluck(m,t,vol,pv);
  if(L==='marimba') return leadMarimba(m,t,vol,pv);
  if(L==='organ') return leadOrgan(m,t,vol,pv);
  if(L==='super') return leadSuper(m,t,vol,pv);
  if(L==='cowbell') return leadCowbell(m,t,vol,pv);
  if(L==='steel') return steel(m,t,vol,pv);
  if(L==='rhodes') return rhodes(m,t,vol,pv,1.1);
  if(L==='guitar') return leadGuitar(m,t,vol,pv);
  if(L==='brass') return leadBrass(m,t,vol,pv);
  if(L==='kalimba') return kalimba(m,t,vol,pv);
  if(L==='flute') return flute(m,t,vol,pv);
  if(L==='vibes') return vibes(m,t,vol,pv);
  if(L==='melodica') return melodica(m,t,vol,pv);
  if(L==='koto') return koto(m,t,vol,pv);
  if(L==='voiceA') return voice(m,t,vol,pv,'a',0.34);
  if(L==='voiceO') return voice(m,t,vol,pv,'o',0.3);
  if(L==='talk') return talk(m,t,vol,pv);
  if(L==='gtrLead') return gtr(m,t,{vol:vol*9,drive:true,dur:0.55,bright:0.85,vib:true});
  if(L==='gtrSurf') return gtr(m,t,{vol:vol*3.4,dur:0.9,bright:0.75,rev:3,dly:true,vib:true,pan:pv});
  if(L==='gtrClean') return gtr(m,t,{vol:vol*3.2,dur:0.9,bright:0.7,dly:true,rev:2,pan:pv,vib:true});
  if(L==='banjo') return gtr(m,t,{vol:vol*3,dur:0.45,bright:0.97,pan:pv});
  if(L==='screech') return screech(m,t,vol,pv);
  if(L==='sax') return sax(m,t,vol,pv);
  if(L==='whistle') return whistle(m,t,vol,pv);
  if(L==='softLead') return softLead(m,t,vol,pv);
  if(L==='voiceU') return voice(m,t,vol*0.9,pv,'u',0.45);
  if(L==='gtrWah') return gtr(m,t,{vol:vol*3.6,dur:0.45,bright:0.85,wah:[500,2600],dly:true,pan:pv});
  return leadSaw(m,t,vol,pv);
}
function bass(m,t,dur){

    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.75,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+d);

    f.type='lowpass'; f.frequency.value=900; env(g,t,0.002,0.6,Math.min(0.45,dur));
    o.connect(f); f.connect(g); g.connect(shaper); o.start(t); o.stop(t+0.5); noise(t,'bandpass',1200,0.05,0.01); return;
  }
  if(B==='organ'){
    const g=AC.createGain(); env(g,t,0.004,0.32,Math.min(dur,0.35)); g.connect(musicBus);
    [[1,1],[2,0.45]].forEach(([r,a])=>{const o=AC.createOscillator(), og=AC.createGain(); o.type='sine'; o.frequency.value=mtof(m)*r; og.gain.value=a; o.connect(og); og.connect(g); o.start(t); o.stop(t+0.4);}); return;
  }
  if(B==='slap'){
    const o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain(); o.type='sawtooth'; o.frequency.value=mtof(m);
    f.type='lowpass'; f.Q.value=5; f.frequency.setValueAtTime(2600,t); f.frequency.exponentialRampToValueAtTime(280,t+0.12);
    env(g,t,0.001,0.3,Math.min(dur,0.3)); o.connect(f); f.connect(g); g.connect(musicBus); o.start(t); o.stop(t+0.35); noise(t,'highpass',3000,0.06,0.01); return;
  }
  if(B==='upright'){
    const o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain(); o.type='triangle';
    o.frequency.setValueAtTime(mtof(m)*1.01,t); o.frequency.exponentialRampToValueAtTime(mtof(m),t+0.05);
    f.type='lowpass'; f.frequency.value=700; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(f); f.connect(g); g.connect(musicBus); o.start(t); o.stop(t+dur+0.05); return;
  }
  if(B==='sub'){
    const o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.value=mtof(m);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.65,t+0.015); g.gain.setValueAtTime(0.6,t+dur*0.6); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05); return;
  }
  if(B==='cello'){
    const o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain(); o.type='sawtooth'; o.frequency.value=mtof(m);
    f.type='lowpass'; f.frequency.value=900; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(f); f.connect(g); g.connect(musicBus); g.connect(revSend); o.start(t); o.stop(t+dur+0.05); return;
  }
  if(B==='chip'){
    const o=AC.createOscillator(), g=AC.createGain(); o.type='square'; o.frequency.value=mtof(m);
    env(g,t,0.002,0.12,dur*0.8); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+dur); return;

    env(g,t,0.004,0.4,dur); o.connect(g); g.connect(musicBus); o.start(t); o.stop(t+dur+0.05); return;

function kick(t,vol){
  t=t||AC.currentTime; vol=vol||0.9;
  if(SONG.kit==='hard'){ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(240,t); o.frequency.exponentialRampToValueAtTime(46,t+0.09); env(g,t,0.001,vol*0.95,0.42); o.connect(g); g.connect(drive); o.start(t); o.stop(t+0.5); noise(t,'highpass',2500,0.28*vol,0.015); if(vol>0.5) duck(t,true); return; }
  if(SONG.kit==='chip'){ const o=AC.createOscillator(),g=AC.createGain(); o.type='square'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(50,t+0.07); env(g,t,0.001,vol*0.35,0.09); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.12); if(vol>0.5) duck(t); return; }
  if(SONG.kit==='folk'){ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(105,t); o.frequency.exponentialRampToValueAtTime(55,t+0.12); env(g,t,0.003,vol*0.8,0.28); o.connect(g); g.connect(master); g.connect(revSend); o.start(t); o.stop(t+0.32); noise(t,'lowpass',450,vol*0.3,0.08); return; }
  if(SONG.kit==='lofi'){ const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(48,t+0.1); env(g,t,0.003,vol*0.8,0.3); o.connect(f); f.connect(g); g.connect(master); o.start(t); o.stop(t+0.35); if(vol>0.5) duck(t); return; }
  if(SONG.kit==='soft'){ const o=AC.createOscillator(),g=AC.createGain(); o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(45,t+0.1); env(g,t,0.004,vol*0.7,0.25); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.3); return; }
  kickStd(t,vol);
}
function snare(t,vol){
  vol=vol||0.28;
  if(SONG.kit==='chip') return noise(t,'lowpass',5000,vol*0.9,0.07);
  if(SONG.kit==='hard'){ snareStd(t,vol*1.3); return noise(t,'bandpass',1800,vol*0.8,0.3,{q:0.7,rev:true}); }
  if(SONG.kit==='soft') return noise(t,'bandpass',3000,vol*0.5,0.18,{q:0.6,a:0.02,rev:true});
  if(SONG.kit==='folk') return noise(t,'bandpass',900,vol*0.7,0.07,{q:1.5,rev:true});
  if(SONG.kit==='lofi'){ noise(t,'bandpass',1600,vol*0.8,0.14,{q:0.9}); return; }
  if(SONG.kit==='rock'){ snareStd(t,vol*1.15); return noise(t,'bandpass',2000,vol*0.7,0.25,{q:0.7,rev:true}); }
  snareStd(t,vol);
}
function hat(t,vol,open){
  if(SONG.kit==='chip') return noise(t,'highpass',9000,(vol||0.13)*0.8,0.02);
  if(SONG.kit==='soft') return noise(t,'highpass',6000,(vol||0.13)*0.5,0.08,{a:0.01});
  if(SONG.kit==='folk') return noise(t,'bandpass',2600,(vol||0.13)*0.7,0.04,{q:1.2});
  if(SONG.kit==='lofi') return noise(t,'bandpass',6500,(vol||0.13)*0.8,0.04,{q:0.8});
  if(SONG.kit==='shaker') return noise(t,'bandpass',7000,(vol||0.13)*1.2,0.05,{q:1,a:0.008,pan:(Math.random()-.5)*0.5});
  hatStd(t,vol,open);
}
function rim(t,vol){ vol=vol||0.22; noise(t,'bandpass',1900,vol,0.04,{q:4}); const o=AC.createOscillator(),g=AC.createGain(); o.frequency.value=480; env(g,t,0.001,vol*0.8,0.035); o.connect(g); g.connect(master); o.start(t); o.stop(t+0.06); }
let gdrive=null;
function getGDrive(){
  if(gdrive) return gdrive;
  gdrive=AC.createWaveShaper(); const c=new Float32Array(2048); for(let i=0;i<2048;i++){const x=i/1024-1; c[i]=Math.tanh(x*14);} gdrive.curve=c;
  const hp=AC.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=90;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3600; lp.Q.value=0.8;
  const out=AC.createGain(); out.gain.value=0.2;
  gdrive.connect(hp); hp.connect(lp); lp.connect(out); out.connect(master); out.connect(revSend); out.connect(delaySend);
  return gdrive;
}
function steel(m,t,vol,pv){
  vol=vol||0.12; const g=AC.createGain();
  [[1,1,0.9],[2,0.5,0.5],[3,0.22,0.25],[4.2,0.07,0.08]].forEach(([r,a,d])=>{const o=AC.createOscillator(),gg=AC.createGain(); o.type='sine';
    o.frequency.setValueAtTime(mtof(m)*r*1.012,t); o.frequency.exponentialRampToValueAtTime(mtof(m)*r,t+0.03);
    env(gg,t,0.002,vol*1.4*a,d); o.connect(gg); gg.connect(g); o.start(t); o.stop(t+d+0.05);});
  outChain(g,pv);
}
function rhodes(m,t,vol,pv,dur){
  vol=vol||0.12; dur=dur||1.2;
  const c=AC.createOscillator(), md=AC.createOscillator(), mg=AC.createGain(), g=AC.createGain();
  c.type='sine'; md.type='sine'; c.frequency.value=mtof(m); md.frequency.value=mtof(m);
  mg.gain.setValueAtTime(mtof(m)*1.1,t); mg.gain.exponentialRampToValueAtTime(mtof(m)*0.04,t+0.35);
  md.connect(mg); mg.connect(c.frequency); env(g,t,0.004,vol*1.5,dur); c.connect(g);
  c.start(t); md.start(t); c.stop(t+dur+0.1); md.stop(t+dur+0.1);
  const p=panned(g,pv||0); p.connect(master); p.connect(revSend);
}
function leadGuitar(m,t,vol,pv){
  const o=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain(), lfo=AC.createOscillator(), lg=AC.createGain();
  o.type='sawtooth'; o2.type='square';
  o.frequency.setValueAtTime(mtof(m-1),t); o.frequency.exponentialRampToValueAtTime(mtof(m),t+0.05); o2.frequency.value=mtof(m); o2.detune.value=7;
  lfo.frequency.value=5.5; lg.gain.setValueAtTime(0,t); lg.gain.linearRampToValueAtTime(18,t+0.25); lfo.connect(lg); lg.connect(o.detune);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol*6,t+0.005); g.gain.exponentialRampToValueAtTime(vol*2,t+0.3); g.gain.exponentialRampToValueAtTime(0.0001,t+0.55);
  o.connect(g); o2.connect(g); g.connect(getGDrive()); [o,o2,lfo].forEach(x=>{x.start(t); x.stop(t+0.6);});
}
function powerChord(m,t,dur,vol){
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.004); g.gain.exponentialRampToValueAtTime(vol*0.4,t+dur*0.7); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  g.connect(getGDrive());
  [0,7,12].forEach((d,i)=>{const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m+d); o.detune.value=(i-1)*4; o.connect(g); o.start(t); o.stop(t+dur+0.02);});
}
function leadBrass(m,t,vol,pv){

  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol*1.2,t+0.04); g.gain.setValueAtTime(vol*1.2,t+0.28); g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
  [-7,0,7].forEach(d=>{const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=mtof(m); o.detune.value=d; o.connect(f); o.start(t); o.stop(t+0.65);});

function kalimba(m,t,vol,pv){

  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol*1.8,t+0.04); g.gain.setValueAtTime(vol*1.5,t+0.26); g.gain.exponentialRampToValueAtTime(0.0001,t+0.48);
  o.connect(g); o.start(t); lfo.start(t); o.stop(t+0.5); lfo.stop(t+0.5);

function timpani(m,t,vol){
  const o=AC.createOscillator(), g=AC.createGain(); o.type='sine';

function tamb(t,vol){ vol=vol||0.1; for(let k=0;k<3;k++) noise(t+k*0.009,'bandpass',8200,vol*(1-k*0.3),0.05,{q:2,pan:0.3}); }
function resetAudio(){
  if(!AC) return; const t=AC.currentTime;
  filt.frequency.cancelScheduledValues(t); filt.frequency.setValueAtTime(filt.frequency.value,t); filt.frequency.setTargetAtTime(18000,t,0.05);
  musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(1,t);
}


const LEVELS=[{n:'Intro',l:0,sp:8},{n:'Build',l:12,sp:8},{n:'Full',l:26,sp:6},{n:'Max',l:40,sp:4,h:1}];
let timer=null, cur=null;
function stop(){ if(timer){clearInterval(timer);timer=null;} cur=null; if(AC) resetAudio(); render(); }
function play(i,li){
  if(timer){clearInterval(timer);timer=null;}
  initAudio(); resetAudio(); SONG=SONGS[i]; cur={i,li};
  const L=LEVELS[li], sd=60/SONG.bpm/4; if(delayNode) delayNode.delayTime.setValueAtTime(sd*4*0.75,AC.currentTime);
  let st=0; const t0=AC.currentTime+0.1;
  timer=setInterval(()=>{
    while(t0+st*sd < AC.currentTime+0.15){
      const t=t0+st*sd; playStep(st,t,L.l,sd);
      if(st%L.sp===0){ const m=melodyAt(st); lead(m,t,0.13,0); if(L.h) lead(m-12,t,0.05,0); }
      st++;
    }
  },25);
  render();
}
function render(){
  const box=document.getElementById('list'); box.innerHTML='';
  SONGS.forEach((S,i)=>{
    const c=document.createElement('section'); c.className='card'+(cur&&cur.i===i?' on':''); c.style.setProperty('--sc',S.sc);
    c.innerHTML='<h2>'+S.name+'</h2><p class="v">'+S.vibe+'</p><p class="d">'+S.desc+(S.lvl>1?' · Unlocks at level '+S.lvl:' · Open from start')+'</p>';
    const row=document.createElement('div'); row.className='lv'; row.setAttribute('role','group'); row.setAttribute('aria-label','Play '+S.name);
    LEVELS.forEach((L,li)=>{ const b=document.createElement('button'); b.textContent=L.n; const on=cur&&cur.i===i&&cur.li===li;
      b.setAttribute('aria-pressed',on?'true':'false'); b.addEventListener('click',()=>on?stop():play(i,li)); row.appendChild(b); });
    c.appendChild(row); box.appendChild(c);
  });
}
document.getElementById('stopAll').addEventListener('click',stop);
render();
})();
</script></body></html>
