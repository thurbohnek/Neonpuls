<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neonpuls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Rubik:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12052a; --ink:#f7f0ff; --muted:#b3a2e0;
  --magenta:#ff2e88; --cyan:#22e4ff; --sun:#ffd23f; --lime:#7dff5a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#12052a; --ink:#f7f0ff; --muted:#b3a2e0; } }
:root[data-theme="dark"]{ --bg:#12052a; --ink:#f7f0ff; --muted:#b3a2e0; }
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.citem canvas{display:block;border-radius:50%}
#hud{position:absolute;top:10px;left:0;right:0;text-align:center;pointer-events:none}
#score{font-family:"Bungee",system-ui,sans-serif;font-size:clamp(40px,11vw,68px);line-height:1;text-shadow:0 0 18px rgba(255,255,255,.35)}
#combo{font-weight:700;font-size:15px;color:var(--muted);margin-top:4px;min-height:1.2em}
#hud .prog{width:min(220px,55vw);height:5px;margin:6px auto 0;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
#hud .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--sun));border-radius:99px;transition:width .3s}
.songcard{position:relative}
.songcard .endless{position:absolute;top:10px;right:10px;font-family:"Rubik",system-ui,sans-serif;font-weight:700;font-size:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);color:var(--ink);box-shadow:none}
.songcard .endless[aria-pressed="true"]{background:var(--sun);border-color:var(--sun);color:#12052a}
#lives{font-size:22px;letter-spacing:4px;margin-top:6px;color:var(--magenta);text-shadow:0 0 10px rgba(255,46,136,.7);min-height:1.2em}
#lives .empty{color:rgba(255,255,255,.25);text-shadow:none}
#combo .mult{color:var(--sun);margin-left:8px}
#pauseBtn{position:absolute;top:10px;right:12px;width:48px;height:48px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);color:var(--ink);box-shadow:0 0 14px rgba(34,228,255,.25);z-index:2}
#pauseBtn svg{display:block}
#pause h2{color:var(--cyan);text-shadow:0 0 18px rgba(34,228,255,.6)}
#pause button{min-width:220px}
#callout{position:absolute;top:22%;left:0;right:0;text-align:center;font-family:"Bungee",system-ui,sans-serif;font-size:clamp(28px,9vw,56px);pointer-events:none;opacity:0}
#callout.pop{animation:pop 1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.14)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:16px;text-align:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 50%,rgba(18,5,42,.55),rgba(18,5,42,.93))}
.hidden{display:none !important}
h1{font-family:"Bungee Shade","Bungee",system-ui,sans-serif;font-weight:400;font-size:clamp(44px,13vw,100px);margin:0;line-height:.92;text-shadow:0 0 16px var(--magenta),0 0 44px var(--cyan)}
h2{font-family:"Bungee",system-ui,sans-serif;font-weight:400;font-size:clamp(22px,6vw,32px);margin:0;color:var(--magenta);text-shadow:0 0 18px rgba(255,46,136,.6)}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;width:100%;max-width:500px;flex-shrink:0}
button.song{font-family:"Rubik",system-ui,sans-serif;text-align:left;padding:8px 11px;border-radius:14px;background:rgba(24,8,52,.82);border:2px solid rgba(255,255,255,.14);color:var(--ink);box-shadow:none;font-size:13px;line-height:1.3}
button.song b{display:block;font-family:"Bungee",system-ui,sans-serif;font-weight:400;font-size:16px;color:var(--sc)}
button.song span{display:block;color:var(--muted);font-size:12px}
button.song[aria-checked="true"]{border-color:var(--sc);background:rgba(255,255,255,.12);box-shadow:0 0 20px var(--sc)}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.ctrl-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700}
.seg{display:flex;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;gap:2px}
.seg button{font-family:"Rubik",system-ui,sans-serif;font-weight:700;font-size:13px;padding:8px 12px;background:transparent;color:var(--ink);box-shadow:none;border-radius:999px}
.seg button:disabled{opacity:.4}
.seg button[aria-checked="true"]{background:var(--cyan);color:#12052a}
.ctrl-hint{font-size:13px;line-height:1.35;color:var(--muted);margin:0;max-width:34ch;min-height:2.7em}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:500px;flex-shrink:0}
.lvlchip{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.lvlchip b{font-family:"Bungee",system-ui,sans-serif;font-weight:400;font-size:14px;white-space:nowrap}
.bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--magenta));border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.streak{font-weight:700;font-size:15px;white-space:nowrap}
button.small{font-size:13px;padding:8px 14px}
button.danger{border-color:#ff5d5d;color:#ff9d9d;box-shadow:0 0 14px rgba(255,93,93,.3)}
.daily{width:100%;max-width:500px;text-align:left;background:rgba(24,8,52,.82);border:2px solid rgba(255,210,63,.35);border-radius:16px;padding:10px 14px;box-sizing:border-box;flex-shrink:0}
.daily h3{margin:0 0 4px;font-family:"Bungee",system-ui,sans-serif;font-weight:400;font-size:15px;color:var(--sun)}
.daily p{margin:0 0 8px;font-size:13px;color:var(--muted)}
.daily ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.daily li{font-size:13px;display:flex;gap:8px;align-items:center}
.daily .chk{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.3);flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;box-sizing:border-box}
.daily li.done .chk{background:var(--lime);border-color:var(--lime);color:#12052a}
.daily li.done .t{text-decoration:line-through;color:var(--muted)}
.daily small{margin-left:auto;color:var(--muted);font-weight:700}
.gems{display:flex !important;gap:5px;margin-top:5px;padding-left:2px}
.gem{display:block;width:9px;height:9px;transform:rotate(45deg);border-radius:2px;background:rgba(255,255,255,.18)}
button.song:disabled{opacity:.45}
button.song .tag{color:var(--sun);font-weight:700}
.rankrow{display:flex;align-items:center;gap:20px}
.rank{font-family:"Bungee",system-ui,sans-serif;font-size:clamp(64px,20vw,110px);line-height:1}
.big.mid{font-size:clamp(44px,12vw,72px)}
.xpbox{width:100%;max-width:340px}
.xpbox .lv{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:6px}
.xpbox .bar{height:12px}
.tiny{font-size:12px;color:var(--muted);margin:6px 0 0}
.lvup{font-family:"Bungee",system-ui,sans-serif;color:var(--sun);margin:6px 0 0;font-size:17px;text-shadow:0 0 14px rgba(255,210,63,.7)}
.rewards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;width:100%;max-width:340px;text-align:left}
.rewards li{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;font-size:14px;animation:rin .4s ease-out both}
@keyframes rin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;width:100%;max-width:500px}
button.citem{font-family:"Rubik",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;background:rgba(24,8,52,.85);border:2px solid rgba(255,255,255,.14);color:var(--ink);box-shadow:none;font-size:13px;font-weight:700}
button.citem[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 16px rgba(34,228,255,.5)}
button.citem small{color:var(--muted);font-weight:500;font-size:11px}
button.citem.locked{opacity:.55}
.alist{list-style:none;padding:0;margin:0;width:100%;max-width:500px;display:flex;flex-direction:column;gap:8px;text-align:left}
.alist li{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.06);border-radius:12px;padding:10px 12px}
.alist li.locked{opacity:.5}
.alist .ic{font-size:22px}
.alist b{display:block;font-size:14px}
.alist span{font-size:12px;color:var(--muted)}
#collBody{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.overlay.menu{justify-content:space-between;gap:10px;padding:14px 18px 18px}
.logo{font-size:clamp(34px,10.5vw,64px) !important;line-height:1 !important}
.dailychip{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;max-width:460px;text-align:left;font-family:"Rubik",system-ui,sans-serif;font-size:13px;padding:10px 14px;border-radius:16px;background:rgba(24,8,52,.85);border:2px solid rgba(255,210,63,.4);color:var(--ink);box-shadow:none;flex-shrink:0}
.dailychip b{font-family:"Bungee",system-ui,sans-serif;font-weight:400;color:var(--sun);font-size:14px;display:block}
.dailychip .dc-r{font-family:"Bungee",system-ui,sans-serif;color:var(--sun);font-size:15px;white-space:nowrap}
.picker{display:flex;align-items:stretch;gap:8px;width:100%;flex-shrink:0}
.picker .arrow{flex:0 0 44px;padding:0;font-size:28px;line-height:1;border-radius:14px;background:rgba(24,8,52,.85);border:2px solid rgba(255,255,255,.18);color:var(--ink);box-shadow:none;font-family:"Rubik",system-ui,sans-serif}
.songwrap{width:100%;max-width:460px;flex-shrink:0}
.songcard{flex:1 1 0;min-width:0;height:150px;overflow:hidden;display:flex;flex-direction:column;justify-content:center;text-align:left;padding:12px 14px;border-radius:16px;background:rgba(24,8,52,.88);border:2px solid var(--sc);box-shadow:0 0 22px var(--sc);touch-action:pan-y;box-sizing:border-box}
.songcard b,.songcard span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.songcard b{display:block;font-family:"Bungee",system-ui,sans-serif;font-weight:400;font-size:22px;color:var(--sc);line-height:1.1}
.songcard span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.songcard .tag{color:var(--sun);font-weight:700}
.songcard.locked{box-shadow:none;opacity:.75}
.sdots{display:flex;gap:6px;justify-content:center;flex-shrink:0;margin-top:-4px}
.sdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22)}
.sdots i.on{background:var(--ink)}
.sdots i.lk{background:transparent;border:1px solid rgba(255,255,255,.25);box-sizing:border-box}
.opts{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;flex-shrink:0}
.optrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.optrow .ctrl-label{min-width:74px;text-align:right}
.opts .ctrl-hint{min-height:2.6em;margin:0}
.startwrap{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
#startBtn{min-width:220px;font-size:22px}
#startNote{min-height:1.4em}
.lead{max-width:32ch;font-size:15px;line-height:1.45;margin:0}
.day{color:var(--muted);font-size:14px;line-height:1.4;max-width:34ch;margin:0}
.big{font-family:"Bungee",system-ui,sans-serif;font-size:clamp(72px,22vw,128px);line-height:1;margin:0;text-shadow:0 0 30px rgba(34,228,255,.5)}
.rec{font-family:"Bungee",system-ui,sans-serif;color:var(--sun);margin:0;font-size:18px;text-shadow:0 0 14px rgba(255,210,63,.7)}
.stats{display:flex;flex-wrap:wrap;justify-content:center;max-width:340px;row-gap:12px;gap:24px;color:var(--muted);font-size:14px;font-weight:700}
.stats b{display:block;font-family:"Bungee",system-ui,sans-serif;font-weight:400;color:var(--ink);font-size:24px;margin-top:2px}
button{font-family:"Bungee",system-ui,sans-serif;font-size:20px;padding:16px 34px;border-radius:999px;border:0;background:var(--sun);color:#1a0730;cursor:pointer;box-shadow:0 0 26px rgba(255,210,63,.55);touch-action:manipulation}
button:active{transform:scale(.96)}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--cyan);box-shadow:0 0 18px rgba(34,228,255,.35);font-size:15px;padding:12px 24px}
button:disabled{opacity:.5}
button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" aria-label="Game board. Swipe to change color."></canvas>
  <div id="hud" class="hidden"><div id="score">0</div><div id="combo"></div><div id="lives"></div><div id="prog" class="prog"><i id="progBar"></i></div></div>
  <button id="pauseBtn" class="hidden" aria-label="Pause"><svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><rect x="1" y="1" width="5.5" height="18" rx="1.6" fill="currentColor"/><rect x="11.5" y="1" width="5.5" height="18" rx="1.6" fill="currentColor"/></svg></button>
  <div id="callout" aria-live="polite"></div>
  <div id="pause" class="overlay hidden">
    <h2>Paused</h2>
    <p class="day" id="pauseInfo"></p>
    <button id="resumeBtn">Resume</button>
    <button id="restartBtn" class="ghost">Restart</button>
    <button id="soundBtn" class="ghost">Sound: On</button>
    <button id="quitBtn" class="ghost">Main menu</button>
  </div>

  <div id="menu" class="overlay menu">
    <div class="topbar">
      <div class="lvlchip"><b id="mLevel">Level 1</b><div class="bar"><i id="mXp"></i></div></div>
      <span class="streak" id="mStreak">🔥 0</span>
      <button class="ghost small" id="collBtn">Collection</button>
    </div>
    <h1 class="logo">Neonpuls</h1>
    <button class="dailychip" id="dailyBtn" aria-label="Daily missions"><span><b>Daily</b><span id="sotd"></span></span><span class="dc-r" id="dailyCount">0/3</span></button>
    <div class="songwrap">
      <div class="picker">
        <button class="arrow" id="prevSong" aria-label="Previous song">‹</button>
        <div class="songcard" id="songCard" aria-live="polite"></div>
        <button class="arrow" id="nextSong" aria-label="Next song">›</button>
      </div>
      <div class="sdots" id="songDots" style="margin-top:8px"></div>
    </div>
    <div class="opts">
      <div class="optrow"><span class="ctrl-label" id="diffLabel">Difficulty</span>
        <div class="seg" id="diffSeg" role="radiogroup" aria-labelledby="diffLabel">
          <button data-d="easy" role="radio">Easy</button><button data-d="normal" role="radio">Normal</button><button data-d="hard" role="radio">Hard</button>
        </div></div>
      <div class="optrow"><span class="ctrl-label" id="ctrlLabel">Controls</span>
        <div class="seg" id="ctrlSeg" role="radiogroup" aria-labelledby="ctrlLabel">
          <button data-c="swipe" role="radio">Swipe</button><button data-c="halves" role="radio">Sides</button><button data-c="buttons" role="radio">Buttons</button>
        </div></div>
      <p class="ctrl-hint" id="optHint"></p>
    </div>
    <div class="startwrap">
      <button id="startBtn">Start</button>
      <p class="day" id="startNote"></p>
    </div>
  </div>

  <div id="dailySheet" class="overlay hidden">
    <h2 style="color:var(--sun);text-shadow:0 0 18px rgba(255,210,63,.6)">Daily</h2>
    <div class="daily">
      <p id="sotdFull"></p>
      <ul id="missions"></ul>
    </div>
    <p class="day" id="dayLabel"></p>
    <button id="dailyBack" class="ghost">Back</button>
  </div>

  <div id="coll" class="overlay hidden">
    <h2>Collection</h2>
    <div class="seg" id="collTabs" role="tablist">
      <button data-t="balls" role="tab">Orbs</button>
      <button data-t="tunnels" role="tab">Tunnels</button>
      <button data-t="ach" role="tab">Awards</button>
      <button data-t="juke" role="tab">Jukebox</button>
    </div>
    <div id="collBody"></div>
    <button id="collBack" class="ghost">Back</button>
    <button id="resetBtn" class="ghost small danger">Reset progress</button>
  </div>

  <div id="over" class="overlay hidden">
    <h2 id="overTitle">The music stopped</h2>
    <div class="rankrow">
      <div class="rank" id="rank">A</div>
      <div><p class="big mid" id="finalScore">0</p><p class="rec hidden" id="newRec">New record!</p></div>
    </div>
    <div class="xpbox">
      <div class="lv"><span id="lvlNow">Level 1</span><span id="xpGain">+0 XP</span></div>
      <div class="bar"><i id="xpBar"></i></div>
      <p class="tiny" id="xpNote"></p>
      <p class="lvup hidden" id="lvup"></p>
    </div>
    <ul class="rewards" id="rewards"></ul>
    <button id="againBtn">Play again</button>
    <div class="seg" id="overDiff" role="radiogroup" aria-label="Difficulty for next run">
      <button data-d="easy" role="radio">Easy</button><button data-d="normal" role="radio">Normal</button><button data-d="hard" role="radio">Hard</button>
    </div>
    <div class="stats">
      <div>Hits<b id="stHits">0</b></div>
      <div>Best streak<b id="stStreak">0</b></div>
      <div>Perfects<b id="stPerf">0</b></div>
      <div>Lives used<b id="stUsed">0</b></div>
      <div>Lives won<b id="stGained">0</b></div>
      <div>Best<b id="stBest">0</b></div>
    </div>
    <button id="songBtn" class="ghost">Hear your song</button>
    <button id="menuBtn" class="ghost">Menu</button>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, DPR, cx, cy, unit, hitR, orbR;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const r = cv.getBoundingClientRect(); W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  cx = W/2; cy = H*0.53; unit = Math.min(W, H*0.92);
  hitR = unit*0.37; orbR = unit*0.05;
}
addEventListener('resize', resize); resize();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const PAL = [
  {c:'#ff2e88', rgb:'255,46,136'},
  {c:'#22e4ff', rgb:'34,228,255'},
  {c:'#ffd23f', rgb:'255,210,63'},
  {c:'#f4f4ff', rgb:'244,244,255'}
];
const MEL = [60,62,64,67,69,72,74,76,79,81,84];
const SONGS=[
 {id:'neonpuls', name:'Neonpuls', vibe:'House, 104 bpm', bpm:104, hue:0, sc:'#ff2e88', style:'house',
  roots:[33,29,36,31], pads:[[57,60,64],[53,57,60],[55,60,64],[55,59,62]], arps:[[69,72,76,81],[65,69,72,77],[67,72,76,79],[67,71,74,79]],
  A:[[76,72,69,72,72,76,74,72],[72,69,65,69,69,72,77,76],[79,76,72,76,76,79,74,72],[74,71,67,71,71,74,76,74]],
  B:[[81,76,72,76,84,81,79,76],[81,77,72,77,77,81,84,81],[79,76,72,76,84,79,76,79],[83,79,74,79,86,83,79,74]]},
 {id:'midnattssol', name:'Midnight Sun', vibe:'Synthwave, 96 bpm', bpm:96, hue:-55, sc:'#22e4ff', style:'wave',

const ksCache={};

  for(let i=N;i<L;i++) d[i]=k*0.5*(d[i-N]+(i-N-1>=0?d[i-N-1]:0));

  if(o.wah){ const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=4; f.frequency.setValueAtTime(o.wah[0],t); f.frequency.exponentialRampToValueAtTime(o.wah[1],t+Math.max(0.08,dur)); node.connect(f); node=f; }

  }

function update(){
  for(const r of rings) if(!r.done) r.arrive=stepToG(r.step);
  while(stepToG(nextArriveStep)-g < travel && (endlessRun || spawned<SONG_LEN)){
    spawned++;
    let c;
    if(rngRing()<0.72) c=(prevRingColor+1+Math.floor(rngRing()*(active-1)))%active;
    else c=prevRingColor%active;
    rings.push({c, step:nextArriveStep, arrive:stepToG(nextArriveStep), dur:travel, done:false, ok:false});
    prevRingColor=c; nextArriveStep+=spacingSteps;
  }
  const ts=Math.max(timeScale,0.2);
  while(stepToG(nextStep) < g+0.12){
    const eg=stepToG(nextStep), t=AC.currentTime+Math.max(0,eg-g)/ts, st=((nextStep%SONG.spb)+SONG.spb)%SONG.spb;
    playStep(nextStep, t, combo, stepDur/ts);
    const cm=combo%10;
    if(combo>=8 && cm===8 && st%2===0) snare(t,0.07+st*0.006);
    if(combo>=9 && cm===9) snare(t,0.08+st*0.012);
    if(st%4===0) vq.push({g:eg, k:combo>=3});
    nextStep++;
  }
  while(vq.length && vq[0].g<=g){ const e=vq.shift(); pulse=1; if(e.k) bgPulse=1; }
  for(const r of rings){
    if(!r.done && g>=r.arrive){
      if(r.c===player){ r.done=true; onHit(r); }
      else if(g>r.arrive+DIFF.grace){ r.done=true; r.miss=true; onMiss(r); if(state!=='play') break; }
      else break;
    }
  }
  rings=rings.filter(r=>(g-(r.arrive-r.dur))/r.dur<1.45);
  if(!endlessRun && state==='play' && spawned>=SONG_LEN && !finishing && rings.every(r=>r.done)){ finishing=true; setTimeout(onComplete,700); }
}

    const a=Math.random()*6.283, v=(0.25+Math.random())*spd*unit*0.05;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:0.6+Math.random()*1.1,size:1.5+Math.random()*3.5,rgb:col.rgb});
  }
}
function ringBurst(R,col,n,spd){

    if(particles.length>900) particles.shift();
    const a=Math.random()*6.283, v=(0.3+Math.random())*spd*unit*0.05;
    particles.push({x:cx+Math.cos(a)*R,y:cy+Math.sin(a)*R,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:0.8+Math.random()*1.2,size:1.5+Math.random()*3,rgb:col.rgb});

/* ================= RENDER ================= */
function draw(dt,gdt){
  const tnow=performance.now()/1000;
  hue+=(hueTarget-hue)*Math.min(1,dt*3);
  const H0 = hue + SONG.hue + (fever()&&state==='play' ? tnow*90 : 0);

  // background with motion trails
  const bg=ctx.createRadialGradient(cx,cy,0,cx,cy,unit*0.95);
  bg.addColorStop(0,`hsl(${275+H0},75%,${17+bgPulse*7}%)`); bg.addColorStop(1,`hsl(${255+H0},85%,5%)`);
  ctx.globalAlpha = reduceMotion ? 1 : 0.5;
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1;

  const s=shake*(reduceMotion?0.25:1);
  ctx.save();
  ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s);
  const z=1+zoomK*(reduceMotion?0.3:1);
  ctx.translate(cx,cy); ctx.scale(z,z); ctx.translate(-cx,-cy);

  const speed = state==='menu' ? 1.3 : (bpm/60)*2.1*(fever()?1.3:1);
  ctx.globalCompositeOperation='lighter';

  for(const st of stars){
    st.z-=speed*gdt*0.9;
    if(st.z<0.25){st.z=9+Math.random();st.a=Math.random()*6.283;st.off=1+Math.random()*2;}
    const r1=hitR*st.off/st.z, r0=hitR*st.off/(st.z+0.4);
    const al=Math.min(1,(9-st.z)/3)*0.75;
    ctx.strokeStyle=`hsla(${200+H0+st.off*30},100%,85%,${al})`; ctx.lineWidth=Math.min(3.5,2.4/st.z);
    ctx.beginPath(); ctx.moveTo(cx+Math.cos(st.a)*r0,cy+Math.sin(st.a)*r0); ctx.lineTo(cx+Math.cos(st.a)*r1,cy+Math.sin(st.a)*r1); ctx.stroke();
  }

  rot+=gdt*(fever()?0.6:0.25);
  const TH=curTheme(), sides=TH.sides||8;
  for(let i=0;i<walls.length;i++){
    walls[i]-=speed*gdt*0.6; if(walls[i]<0.5) walls[i]+=8.5;
    const wz=walls[i], R=hitR*2.4/wz*(1+pulse*0.05);
    const al=Math.min(1,(9-wz)/3)*Math.min(1,(wz-0.5)/0.8)*(0.3+bgPulse*0.25);
    ctx.strokeStyle=`hsla(${290+H0+wz*14},95%,62%,${al})`; ctx.lineWidth=Math.max(1,3.3/wz);
    ctx.beginPath();
    if(!TH.sides) ctx.arc(cx,cy,R,0,6.283);
    else { const ro=rot+(TH.twist?i*0.2:0); for(let k=0;k<=sides;k++){const a=ro+k*6.283/sides; const x=cx+Math.cos(a)*R, y=cy+Math.sin(a)*R; k?ctx.lineTo(x,y):ctx.moveTo(x,y);} }
    ctx.stroke();
  }
  ctx.strokeStyle=`hsla(${290+H0},95%,62%,0.12)`; ctx.lineWidth=1;
  for(let k=0;k<sides;k++){const a=rot+k*6.283/sides; ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*orbR*2,cy+Math.sin(a)*orbR*2); ctx.lineTo(cx+Math.cos(a)*unit*1.6,cy+Math.sin(a)*unit*1.6); ctx.stroke();}

  const pc = state==='menu' ? PAL[Math.floor(performance.now()/900)%3] : PAL[player];
  const nr = state==='play' ? nextRing() : null;
  let danger=0;
  if(nr && nr.c!==player){ const p=(g-(nr.arrive-nr.dur))/nr.dur; danger=Math.max(0,(p-0.7)/0.3); }

  // hit circle
  ctx.lineWidth=unit*0.03; ctx.strokeStyle=`rgba(${pc.rgb},${0.1+danger*0.15*(0.5+0.5*Math.sin(tnow*40))})`;
  ctx.beginPath(); ctx.arc(cx,cy,hitR,0,6.283); ctx.stroke();
  ctx.setLineDash([unit*0.022,unit*0.02]); ctx.lineDashOffset=-performance.now()*0.02;
  ctx.lineWidth=3; ctx.strokeStyle=`rgba(${pc.rgb},${0.55+orbKick*0.4})`;
  ctx.beginPath(); ctx.arc(cx,cy,hitR*(1+orbKick*0.03+pulse*0.01),0,6.283); ctx.stroke(); ctx.setLineDash([]);

  // combo meter toward next drop
  if(state==='play' && combo>0){
    const fr=(combo%10)/10, mr=hitR+unit*0.045;
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(255,210,63,0.12)'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(cx,cy,mr,0,6.283); ctx.stroke();
    if(fr>0){ ctx.strokeStyle='rgba(255,210,63,0.9)'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(cx,cy,mr,-Math.PI/2,-Math.PI/2+fr*6.283); ctx.stroke();
      ctx.strokeStyle='rgba(255,210,63,0.25)'; ctx.lineWidth=14; ctx.beginPath(); ctx.arc(cx,cy,mr,-Math.PI/2,-Math.PI/2+fr*6.283); ctx.stroke(); }
    ctx.lineCap='butt';
  }

  // rings
  if(state!=='menu'){
    let nextFound=false;
    for(const r of rings){
      const p=(g-(r.arrive-r.dur))/r.dur; if(p<0) continue;
      let R, al=1, w;
      if(p<=1){ const zz=1+(1-p)*7; R=hitR/zz; w=unit*0.036/zz; al=Math.min(1,p*4); }
      else { const q=(p-1)/0.45; R=hitR*(1+q*1.6); w=unit*0.036*(1-q*0.6); al=1-q; }
      if(R<orbR*0.9) continue;
      const isNext=!r.done && !nextFound; if(isNext) nextFound=true;
      const col=PAL[r.c];
      const dim = (!r.done && !isNext) ? 0.5 : 1;
      ctx.lineWidth=w*3.4; ctx.strokeStyle=`rgba(${col.rgb},${0.22*al*dim})`;
      ctx.beginPath(); ctx.arc(cx,cy,R,0,6.283); ctx.stroke();
      if(isNext && !reduceMotion){ // chromatic edge
        ctx.lineWidth=w*0.5; ctx.strokeStyle=`rgba(255,40,80,${0.35*al})`; ctx.beginPath(); ctx.arc(cx-2,cy,R,0,6.283); ctx.stroke();
        ctx.strokeStyle=`rgba(40,160,255,${0.35*al})`; ctx.beginPath(); ctx.arc(cx+2,cy,R,0,6.283); ctx.stroke();
      }
      ctx.lineWidth=w; ctx.strokeStyle=r.ok?`rgba(255,255,255,${al})`:r.miss?`rgba(255,60,60,${al*0.6})`:`rgba(${col.rgb},${al*dim})`;
      ctx.beginPath(); ctx.arc(cx,cy,R,0,6.283); ctx.stroke();
    }
  }

  // shockwaves and rays
  for(let i=shocks.length-1;i>=0;i--){
    const k=shocks[i]; k.life-=gdt*2.2; if(k.life<=0){shocks.splice(i,1);continue;}
    k.r+=k.v*gdt;
    ctx.strokeStyle=`rgba(${k.rgb},${k.life*0.8})`; ctx.lineWidth=k.w*k.life;
    ctx.beginPath();
    if(k.ray!==undefined){ ctx.moveTo(cx+Math.cos(k.ray)*k.r*0.6,cy+Math.sin(k.ray)*k.r*0.6); ctx.lineTo(cx+Math.cos(k.ray)*k.r,cy+Math.sin(k.ray)*k.r); }
    else ctx.arc(cx,cy,k.r,0,6.283);
    ctx.stroke();
  }

  // side colors + orb
  const sideD=hitR*0.5;
  if(state==='play' && ctrl==='swipe'){
    let hintDir=0;
    if(nr && nr.c!==player) hintDir = nr.c>player?1:-1;
    const nb=[]; if(player>0) nb.push([-1,PAL[player-1]]); if(player<active-1) nb.push([1,PAL[player+1]]);
    nb.forEach(([d,col])=>{
      const hint = hintDir===d;
      const x=cx+d*sideD, rr=orbR*(hint?0.7+0.12*Math.sin(tnow*14):0.5);
      const sg=ctx.createRadialGradient(x,cy,0,x,cy,rr*3);
      sg.addColorStop(0,`rgba(${col.rgb},${hint?1:0.8})`); sg.addColorStop(0.35,`rgba(${col.rgb},${hint?0.6:0.35})`); sg.addColorStop(1,`rgba(${col.rgb},0)`);
      ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(x,cy,rr*3,0,6.283); ctx.fill();
      ctx.fillStyle=`rgba(${col.rgb},${hint?1:0.6})`; ctx.font=`bold ${Math.round(orbR*(hint?1.2:0.9))}px Rubik, system-ui, sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(d<0?'‹':'›', x+d*(rr*2.6+(hint?Math.sin(tnow*14)*3:0)), cy);
    });
  }
  const ox=cx+slide*sideD;
  const R=orbR*(1+orbKick*0.35+pulse*0.12);
  drawSkin(ctx,ox,cy,R,pc,curSkin(),tnow);

function drawSkin(c,x,y,R,col,skin,t){
  const glow=(rad,a)=>{const gr=c.createRadialGradient(x,y,0,x,y,rad); gr.addColorStop(0,`rgba(${col.rgb},${a})`); gr.addColorStop(1,`rgba(${col.rgb},0)`); c.fillStyle=gr; c.beginPath(); c.arc(x,y,rad,0,6.283); c.fill();};
  const classic=()=>{const og=c.createRadialGradient(x,y,0,x,y,R*3.6);
    og.addColorStop(0,'rgba(255,255,255,1)'); og.addColorStop(0.22,`rgba(${col.rgb},1)`);
    og.addColorStop(0.42,`rgba(${col.rgb},0.38)`); og.addColorStop(1,`rgba(${col.rgb},0)`);
    c.fillStyle=og; c.beginPath(); c.arc(x,y,R*3.6,0,6.283); c.fill();};
  if(skin==='classic'){ classic(); return; }
  if(skin==='orbit'){ classic(); for(let k=0;k<3;k++){ const a=t*3+k*2.094, px=x+Math.cos(a)*R*2.1, py=y+Math.sin(a)*R*1.1;
      const gr=c.createRadialGradient(px,py,0,px,py,R*0.6); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=gr; c.beginPath(); c.arc(px,py,R*0.6,0,6.283); c.fill(); } return; }
  glow(R*3.2,0.45);
  c.save(); c.globalCompositeOperation='source-over';
  if(skin==='ring'){
    c.strokeStyle=col.c; c.lineWidth=R*0.5; c.beginPath(); c.arc(x,y,R*1.05,0,6.283); c.stroke();
    c.strokeStyle='rgba(255,255,255,.9)'; c.lineWidth=R*0.14; c.beginPath(); c.arc(x,y,R*1.05,0,6.283); c.stroke();
    c.fillStyle='#fff'; c.beginPath(); c.arc(x,y,R*0.28,0,6.283); c.fill();
  } else if(skin==='eye'){
    c.fillStyle='#fff'; c.beginPath(); c.arc(x,y,R*1.2,0,6.283); c.fill();
    const ix=x+Math.cos(t*1.3)*R*0.22, iy=y+Math.sin(t*0.9)*R*0.15;
    c.fillStyle=col.c; c.beginPath(); c.arc(ix,iy,R*0.68,0,6.283); c.fill();
    c.fillStyle='#12052a'; c.beginPath(); c.arc(ix,iy,R*0.32,0,6.283); c.fill();
    c.fillStyle='#fff'; c.beginPath(); c.arc(ix-R*0.18,iy-R*0.2,R*0.12,0,6.283); c.fill();
  } else if(skin==='disco'){
    c.beginPath(); c.arc(x,y,R*1.2,0,6.283); c.save(); c.clip();
    c.fillStyle=col.c; c.fillRect(x-R*1.3,y-R*1.3,R*2.6,R*2.6);
    const st=R*0.4; let i=0;
    for(let gx=x-R*1.3;gx<x+R*1.3;gx+=st) for(let gy=y-R*1.3;gy<y+R*1.3;gy+=st){ i++; const a=(Math.sin(i*2.7+t*5)+1)/2;
      c.fillStyle=`rgba(255,255,255,${a*0.7})`; c.fillRect(gx+1,gy+1,st-2,st-2); }
    c.restore(); c.strokeStyle='rgba(255,255,255,.8)'; c.lineWidth=1.5; c.beginPath(); c.arc(x,y,R*1.2,0,6.283); c.stroke();
  } else if(skin==='rainbow'){
    for(let k=0;k<6;k++){ const a0=t*1.5+k*1.047; c.fillStyle=`hsl(${k*60},100%,62%)`; c.beginPath(); c.moveTo(x,y); c.arc(x,y,R*1.2,a0,a0+1.06); c.closePath(); c.fill(); }
    const gr=c.createRadialGradient(x,y,0,x,y,R*0.7); gr.addColorStop(0,'#fff'); gr.addColorStop(1,col.c); c.fillStyle=gr; c.beginPath(); c.arc(x,y,R*0.6,0,6.283); c.fill();
  } else if(skin==='star'){
    c.beginPath(); for(let k=0;k<10;k++){ const a=-Math.PI/2+t*0.8+k*Math.PI/5, rr=k%2?R*0.65:R*1.55; const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; k?c.lineTo(px,py):c.moveTo(px,py);} c.closePath();
    c.fillStyle=col.c; c.fill(); c.strokeStyle='#fff'; c.lineWidth=2; c.stroke();
  } else if(skin==='heart'){
    const s=R*0.75*(1+0.06*Math.sin(t*8));
    c.beginPath(); c.moveTo(x,y+s*1.3);
    c.bezierCurveTo(x-s*2.1,y+s*0.1,x-s*1.2,y-s*1.6,x,y-s*0.55);
    c.bezierCurveTo(x+s*1.2,y-s*1.6,x+s*2.1,y+s*0.1,x,y+s*1.3); c.closePath();
    c.fillStyle=col.c; c.fill(); c.strokeStyle='#fff'; c.lineWidth=2; c.stroke();
  }
  c.restore();
}

/* ---------- menu ---------- */
function renderTop(){
  const L=levelInfo(SV.xp);
  $('mLevel').textContent='Level '+L.level;
  $('mXp').style.width=(L.into/L.need*100)+'%';
  const sN=streakNow(); $('mStreak').textContent='🔥 '+sN; $('mStreak').title=sN+' day streak';
}
function renderDaily(){
  const M=todayMissions(), sid=songOfDay(), S=SONGS.find(s=>s.id===sid), done=M.list.filter(m=>m.done).length;
  $('sotd').innerHTML='Song of the day: <b style="display:inline;font-family:inherit;font-size:inherit;color:'+S.sc+'">'+S.name+'</b> 2× XP';
  $('dailyCount').textContent=done+'/3 ✓';
  $('sotdFull').innerHTML='Song of the day: <b style="color:'+S.sc+'">'+S.name+'</b>, 2× XP';
  $('missions').innerHTML=M.list.map(m=>`<li class="${m.done?'done':''}"><span class="chk">${m.done?'✓':''}</span><span class="t">${missionText(m)}</span><small>${m.done?'':m.prog+'/'+m.n}</small></li>`).join('');
}
function renderSongs(){
  const S=SONG, un=songUnlocked(S), sd=songData(S.id), card=$('songCard');
  card.style.setProperty('--sc',S.sc); card.classList.toggle('locked',!un);
  if(!un){ card.innerHTML='<b>🔒 '+S.name+'</b><span>'+S.vibe+'</span><span>Unlocks at level '+SONG_LV[S.id]+'</span>'; }
  else {
    const best=sd.best[SV.diff]||0;
    const gems='<span class="gems">'+GEMS.map((G,k)=>`<i class="gem" title="${G.name}: ${G.desc}" style="${sd.gems[k]?'background:'+G.c+';box-shadow:0 0 6px '+G.c:''}"></i>`).join('')+'</span>';
    card.innerHTML=(sd.done?'<button class="endless" id="endlessBtn" aria-pressed="'+(SV.endless?'true':'false')+'" title="Endless mode: the song never ends">∞ Endless</button>':'')+'<b'+(sd.done?' style="padding-right:96px"':'')+'>'+S.name+'</b><span>'+S.vibe+'</span>'+(S.id===songOfDay()?'<span class="tag">★ Song of the day</span>':'')+
      '<span>'+(best?'Best: '+best+(sd.rank?', rank '+sd.rank:''):'Not played on '+DIFF.name+' yet')+'</span>'+gems;
  }
  $('songDots').innerHTML=songOrder().map(i=>`<i class="${i===songIdx?'on':''} ${songUnlocked(SONGS[i])?'':'lk'}"></i>`).join('');
}
function songOrder(){ return SONGS.map((_,i)=>i).sort((a,b)=>(songUnlocked(SONGS[b])-songUnlocked(SONGS[a]))||(SONG_LV[SONGS[a].id]||1)-(SONG_LV[SONGS[b].id]||1)||a-b); }
function stepSong(d){
  const O=songOrder(), n=O.length, pos=O.indexOf(songIdx);
  songIdx=O[(pos+d+n)%n]; SONG=SONGS[songIdx];
  if(songUnlocked(SONG)) try{localStorage.setItem('neonpuls-song',String(songIdx))}catch(e){}
  renderMenu();
}
$('songCard').addEventListener('click',e=>{ if(e.target.id==='endlessBtn'){ SV.endless=!SV.endless; persist(); renderSongs(); } });
$('prevSong').addEventListener('click',()=>stepSong(-1));
$('nextSong').addEventListener('click',()=>stepSong(1));
(()=>{ let sx=null; const c=$('songCard');
  c.addEventListener('pointerdown',e=>{sx=e.clientX;});
  c.addEventListener('pointerup',e=>{ if(sx===null) return; const dx=e.clientX-sx; sx=null; if(Math.abs(dx)>40) stepSong(dx<0?1:-1); });
  c.addEventListener('pointercancel',()=>{sx=null;});
})();
$('dailyBtn').addEventListener('click',()=>{ renderDaily(); $('menu').classList.add('hidden'); $('dailySheet').classList.remove('hidden'); });
$('dailyBack').addEventListener('click',()=>{ $('dailySheet').classList.add('hidden'); $('menu').classList.remove('hidden'); });
function renderDiff(){
  document.querySelectorAll('#diffSeg button').forEach(b=>b.setAttribute('aria-checked', b.dataset.d===SV.diff?'true':'false'));
  const lockedSong=!songUnlocked(SONG), lockedHard = SV.diff==='hard' && !hardUnlocked(SONG.id);
  $('startBtn').disabled=lockedSong||lockedHard;
  $('startBtn').textContent=lockedSong?'Locked':lockedHard?'Hard locked':'Start';
  $('startNote').textContent=lockedSong?'Reach level '+SONG_LV[SONG.id]+' to play '+SONG.name+'.':lockedHard?'Earn 2 gems on '+SONG.name+' to unlock Hard.':'';
}
function renderMenu(){ renderTop(); renderDaily(); renderSongs(); renderDiff(); }
document.querySelectorAll('#diffSeg button').forEach(b=>b.addEventListener('click',()=>{
  SV.diff=b.dataset.d; DIFF=DIFFS[SV.diff]; persist(); renderMenu(); $('optHint').textContent=DIFF.hint;
}));

/* ---------- collection ---------- */
let collTab='balls';
function miniCanvas(fn){
  const c=document.createElement('canvas'), d=Math.min(2,window.devicePixelRatio||1);
  c.width=72*d; c.height=72*d; c.style.width='72px'; c.style.height='72px';
  const x=c.getContext('2d'); x.scale(d,d); x.fillStyle='#1b0a3a'; x.beginPath(); x.arc(36,36,36,0,6.283); x.fill();
  x.globalCompositeOperation='lighter'; fn(x); return c;
}
function renderColl(){
  document.querySelectorAll('#collTabs button').forEach(b=>b.setAttribute('aria-checked', b.dataset.t===collTab?'true':'false'));
  const body=$('collBody'); body.innerHTML='';
  if(collTab==='juke'){
    const p=document.createElement('p'); p.className='day';
    p.textContent='Each gem unlocks more of a song: 1 gem adds the melody, 2 gems the full band, 3 gems the master mix. Gems are earned on Normal or Hard.';
    body.appendChild(p);
    const ul=document.createElement('ul'); ul.className='alist';
    songOrder().forEach(i=>{ const S=SONGS[i], un=songUnlocked(S), gc=gemCount(S.id), li=document.createElement('li');
      li.className=un?'':'locked';
      const mix=['Beat only','Melody','Full band','Master mix'][gc];
      const gems=GEMS.map((G,k)=>`<i class="gem" style="display:inline-block;margin-right:5px;${songData(S.id).gems[k]?'background:'+G.c:''}"></i>`).join('');
      li.innerHTML=`<div style="flex:1;min-width:0"><b style="color:${S.sc}">${un?'':'🔒 '}${S.name}</b><span>${un?mix+' ':'Unlocks at level '+SONG_LV[S.id]}</span>${un?'<div style="margin-top:4px">'+gems+'</div>':''}</div>`;
      if(un){ const btn=document.createElement('button'); btn.className='ghost small'; btn.style.minWidth='72px';
        btn.textContent=jbId===S.id?'■ Stop':'▶ Play'; btn.setAttribute('aria-label',(jbId===S.id?'Stop ':'Play ')+S.name);
        btn.addEventListener('click',()=>{ if(jbId===S.id) jbStop(); else jbPlay(S); renderColl(); });
        li.appendChild(btn); }
      ul.appendChild(li); });
    body.appendChild(ul); return;
  }
  if(collTab==='ach'){
    const ul=document.createElement('ul'); ul.className='alist';
    const n=ACH.filter(a=>SV.ach[a.id]).length;
    ACH.slice().sort((a,b)=>(!!SV.ach[b.id])-(!!SV.ach[a.id])).forEach(a=>{ const li=document.createElement('li'), got=!!SV.ach[a.id]; li.className=got?'':'locked';
      li.innerHTML=`<span class="ic">${got?a.ic:'🔒'}</span><div><b>${a.name}</b><span>${a.desc}${a.reward?' · Reward: '+a.reward:''}</span></div>`; ul.appendChild(li); });
    const p=document.createElement('p'); p.className='day'; p.textContent=n+' of '+ACH.length+' unlocked';
    body.appendChild(p); body.appendChild(ul); return;
  }
  const grid=document.createElement('div'); grid.className='cgrid';
  const list = (collTab==='balls'?SKINS:THEMES).slice().sort((a,b)=>(itemUnlocked(b)-itemUnlocked(a))||((a.ach?1000:a.lv)-(b.ach?1000:b.lv)));
  list.forEach(it=>{
    const un=itemUnlocked(it), sel = collTab==='balls'?curSkin()===it.id:curTheme().id===it.id;
    const b=document.createElement('button'); b.className='citem'+(un?'':' locked'); b.setAttribute('aria-pressed',sel?'true':'false');
    const cv2 = collTab==='balls'
      ? miniCanvas(x=>drawSkin(x,36,36,11,PAL[1],it.id,1.2))
      : miniCanvas(x=>{ x.strokeStyle='#ff2e88'; x.lineWidth=2; for(let r=10;r<=30;r+=10){ x.beginPath();
          if(!it.sides) x.arc(36,36,r,0,6.283); else for(let k=0;k<=it.sides;k++){const a=(it.twist?r*0.04:0)-Math.PI/2+k*6.283/it.sides; const px=36+Math.cos(a)*r, py=36+Math.sin(a)*r; k?x.lineTo(px,py):x.moveTo(px,py);} x.stroke(); } });
    b.appendChild(cv2);
    const nm=document.createElement('span'); nm.textContent=un?it.name:'🔒 '+it.name; b.appendChild(nm);
    const sm=document.createElement('small'); sm.textContent= sel?'Equipped': un?'Tap to use': it.ach?'Achievement: '+ACH.find(a=>a.id===it.ach).name:'Level '+it.lv; b.appendChild(sm);
    if(!un) b.disabled=true;
    b.addEventListener('click',()=>{ if(collTab==='balls') SV.skin=it.id; else SV.theme=it.id; persist(); renderColl(); });
    grid.appendChild(b);
  });
  body.appendChild(grid);
}
document.querySelectorAll('#collTabs button').forEach(b=>b.addEventListener('click',()=>{ collTab=b.dataset.t; renderColl(); }));
$('collBtn').addEventListener('click',()=>{ $('menu').classList.add('hidden'); $('coll').classList.remove('hidden'); renderColl(); });
let resetArmed=0;
$('resetBtn').addEventListener('click',()=>{
  const b=$('resetBtn');
  if(performance.now()-resetArmed>4000){ resetArmed=performance.now(); b.textContent='Tap again to erase everything'; setTimeout(()=>{ if(performance.now()-resetArmed>=4000) b.textContent='Reset progress'; },4100); return; }
  resetArmed=0;
  SV=defSave(); DIFF=DIFFS.normal; persist();
  try{ Object.keys(localStorage).filter(k=>/^neonpuls-(best|day)/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){}
  songIdx=0; SONG=SONGS[0]; try{localStorage.setItem('neonpuls-song','0')}catch(e){}
  b.textContent='Progress reset'; renderColl();
  setTimeout(()=>{ b.textContent='Reset progress'; },2000);
});
let jbTimer=null, jbId=null;
function jbStop(){ if(jbTimer){clearInterval(jbTimer);jbTimer=null;} if(jbId){ jbId=null; SONG=SONGS[songIdx]; if(AC) resetAudio(); } }
function jbPlay(S){
  jbStop(); stopReplay(); initAudio(); resetAudio();
  SONG=S; jbId=S.id;
  const gc=gemCount(S.id), lvl=gc>=3?40:gc>=2?26:12, sd=60/S.bpm/4;
  if(delayNode) delayNode.delayTime.setValueAtTime(sd*4*0.75,AC.currentTime);
  let st=0; const t0=AC.currentTime+0.1;
  jbTimer=setInterval(()=>{
    while(t0+st*sd < AC.currentTime+0.15){
      const t=t0+st*sd; playStep(st,t,lvl,sd);
      if(gc>=1 && st%2===0 && (gc>=2 || st%4===0)){ const m=melodyAt(st); lead(m,t,0.11,0); if(gc>=3) lead(m-12,t,0.05,0); }
      st++;
    }
  },25);
}
$('collBack').addEventListener('click',()=>{ jbStop(); $('coll').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu(); });

/* ---------- summary ---------- */
function renderOverDiff(){
  document.querySelectorAll('#overDiff button').forEach(b=>{
    const lock=b.dataset.d==='hard' && !hardUnlocked(SONG.id);
    b.disabled=lock; b.textContent=lock?'🔒 Hard':DIFFS[b.dataset.d].name;
    b.setAttribute('aria-checked', b.dataset.d===SV.diff?'true':'false');
  });
}
document.querySelectorAll('#overDiff button').forEach(b=>b.addEventListener('click',()=>{
  SV.diff=b.dataset.d; DIFF=DIFFS[SV.diff]; persist(); renderOverDiff();
}));
function showSummary(o,r){
  renderOverDiff();
  const rk=$('rank'); rk.textContent=o.rank; rk.style.color=RANK_C[o.rank]; rk.style.textShadow='0 0 30px '+RANK_C[o.rank];
  $('finalScore').textContent=r.score;
  $('newRec').classList.toggle('hidden',!o.rec);
  $('stHits').textContent=r.hits; $('stStreak').textContent=r.maxCombo; $('stPerf').textContent=r.perfects;
  $('stUsed').textContent=r.livesUsed; $('stGained').textContent=r.livesGained; $('stBest').textContent=songData(SONG.id).best[SV.diff]||0;
  const a=levelInfo(o.oldXP), b=levelInfo(SV.xp), bar=$('xpBar');
  $('lvlNow').textContent='Level '+a.level; $('xpGain').textContent='+'+o.xp+' XP';
  $('xpNote').textContent=o.notes.join(', ');
  bar.style.transition='none'; bar.style.width=(a.into/a.need*100)+'%'; void bar.offsetWidth; bar.style.transition='';
  $('lvup').classList.add('hidden');
  setTimeout(()=>{
    if(o.levelUp){
      bar.style.width='100%';
      setTimeout(()=>{ bar.style.transition='none'; bar.style.width='0%'; void bar.offsetWidth; bar.style.transition=''; bar.style.width=(b.into/b.need*100)+'%';
        $('lvlNow').textContent='Level '+b.level; $('lvup').textContent='Level up! You reached level '+b.level; $('lvup').classList.remove('hidden');
        if(AC){ const t=AC.currentTime; [72,76,79,84].forEach((m,i)=>lead(m,t+i*0.09,0.1,0)); } },950);
    } else bar.style.width=(b.into/b.need*100)+'%';
  },500);
  const ul=$('rewards'); ul.innerHTML='';
  const all=o.items.concat(o.unlocks.map(u=>'🔓 Unlocked: '+u));
  all.forEach((t,i)=>{ const li=document.createElement('li'); li.textContent=t; li.style.animationDelay=(0.6+i*0.15)+'s'; ul.appendChild(li); });
  ul.classList.toggle('hidden',!all.length);
}

let cdTimers=[];
function soundLabel(){ $('soundBtn').textContent='Sound: '+(muted?'Off':'On'); }
function pauseGame(){
  if(state!=='play') return;
  state='paused'; if(AC) AC.suspend();
  $('pauseBtn').classList.add('hidden');
  $('pauseInfo').textContent=SONG.name+', score '+score;
  soundLabel(); $('pause').classList.remove('hidden'); $('resumeBtn').focus({preventScroll:true});
}
function resumeGame(){
  if(state!=='paused') return;
  $('pause').classList.add('hidden'); state='countdown';
  cdTimers.forEach(clearTimeout); cdTimers=[];
  ['3','2','1'].forEach((n,i)=>cdTimers.push(setTimeout(()=>callout(n,'#f7f0ff'),i*500)));
  cdTimers.push(setTimeout(()=>{ if(state!=='countdown') return; state='play'; if(AC) AC.resume(); $('pauseBtn').classList.remove('hidden'); },1500));
}
function quitToMenu(){
  cdTimers.forEach(clearTimeout); cdTimers=[];
  state='menu'; rings=[]; stopReplay();
  if(AC){ AC.resume(); resetAudio(); }
  ['pause','over','hud','pauseBtn'].forEach(id=>$(id).classList.add('hidden'));
  $('menu').classList.remove('hidden'); renderMenu();
}
$('pauseBtn').addEventListener('click',pauseGame);
$('resumeBtn').addEventListener('click',resumeGame);
$('restartBtn').addEventListener('click',()=>{ cdTimers.forEach(clearTimeout); cdTimers=[]; start(); });
$('quitBtn').addEventListener('click',quitToMenu);
$('soundBtn').addEventListener('click',()=>{
  muted=!muted; try{localStorage.setItem('neonpuls-muted',muted?'1':'0')}catch(e){}
  if(master) master.gain.value=muted?0:0.75; soundLabel();
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden && state==='play') pauseGame(); });
const CTRL_HINTS={swipe:'Swipe: swipe toward the color on that side of the orb.',halves:'Sides: tap a half of the screen, tap again to switch its colors.',buttons:'Buttons: tap the color you want at the bottom.'};
function renderCtrl(){
  document.querySelectorAll('#ctrlSeg button').forEach(b=>b.setAttribute('aria-checked', b.dataset.c===ctrl?'true':'false'));
}
document.querySelectorAll('#ctrlSeg button').forEach(b=>b.addEventListener('click',()=>{
  ctrl=b.dataset.c; try{localStorage.setItem('neonpuls-ctrl',ctrl)}catch(e){} renderCtrl(); $('optHint').textContent=CTRL_HINTS[ctrl];
}));
renderCtrl();
if(!songUnlocked(SONG)){ songIdx=0; SONG=SONGS[0]; }
renderMenu(); $('optHint').textContent=DIFF.hint;
$('menuBtn').addEventListener('click',()=>{
  if(performance.now()<overLockUntil) return;
  stopReplay(); state='menu'; $('over').classList.add('hidden'); $('menu').classList.remove('hidden'); renderMenu();
});
})();
</script>
</body>
</html>
